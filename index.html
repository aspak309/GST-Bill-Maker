<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nexora Invoice | Premium GST Bill Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .input-box { width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; font-size: 14px; outline: none; transition: all 0.3s; background: #f9fafb; }
        .input-box:focus { border-color: #4f46e5; background: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        /* Hidden Template for PDF */
        #pdf-template { display: none; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Top Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">N</div>
                <span class="font-bold text-lg tracking-tight">Invoice<span class="text-indigo-600">Pro</span></span>
            </div>
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-2 text-sm font-semibold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> System Ready</span>
            </div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-[1fr_380px] gap-8">
        
        <!-- Left Side: Data Entry Form -->
        <div class="space-y-6">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900">Create GST Invoice</h1>
                <p class="text-sm text-slate-500 mt-1">Smart tax routing and precision calculation engine.</p>
            </div>

            <!-- Seller & Buyer Cards -->
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Seller Details -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-slate-900">Seller Details</h2>
                        <span class="badge bg-indigo-50 text-indigo-600">From</span>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="sellerName" class="input-box" value="Nexora Digital" placeholder="Business Name">
                        <textarea id="sellerAddress" class="input-box" rows="2" placeholder="Business Address">Kundanpuri, Ludhiana</textarea>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="sellerGSTIN" class="input-box" placeholder="GSTIN (Optional)">
                            <select id="sellerState" class="input-box">
                                <option value="Punjab" selected>Punjab</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Maharashtra">Maharashtra</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Buyer Details -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-slate-900">Buyer Details</h2>
                        <span class="badge bg-slate-100 text-slate-600">To</span>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="buyerName" class="input-box" placeholder="Client Name">
                        <textarea id="buyerAddress" class="input-box" rows="2" placeholder="Client Address"></textarea>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="buyerGSTIN" class="input-box" placeholder="GSTIN (Optional)">
                            <select id="buyerState" class="input-box">
                                <option value="Delhi" selected>Delhi</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Maharashtra">Maharashtra</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Invoice Meta -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex gap-4">
                <div class="flex-1"><label class="text-xs font-bold text-slate-500 uppercase mb-1 block">Invoice No.</label><input type="text" id="invNum" value="INV-2026-001" class="input-box"></div>
                <div class="flex-1"><label class="text-xs font-bold text-slate-500 uppercase mb-1 block">Date</label><input type="date" id="invDate" class="input-box"></div>
            </div>

            <!-- Items Table -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-slate-900">Items & Services</h2>
                    <button id="addItemBtn" class="text-sm font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl transition">+ Add Item</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-xs text-slate-500 uppercase border-b border-slate-200">
                                <th class="pb-3 font-semibold">Description</th>
                                <th class="pb-3 font-semibold w-24">HSN</th>
                                <th class="pb-3 font-semibold w-20">Qty</th>
                                <th class="pb-3 font-semibold w-28">Rate (₹)</th>
                                <th class="pb-3 font-semibold w-24">GST %</th>
                                <th class="pb-3 font-semibold w-10"></th>
                            </tr>
                        </thead>
                        <tbody id="itemRows" class="divide-y divide-slate-100">
                            <!-- Items injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Side: Live Calculation & Actions -->
        <aside class="relative">
            <div class="sticky top-24 bg-slate-900 text-white rounded-3xl p-8 shadow-2xl border border-slate-800">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-6">Live Summary</h3>
                
                <div class="space-y-4 text-sm font-medium">
                    <div class="flex justify-between text-slate-300"><span>Taxable Amount</span><span id="ui-taxable">₹0.00</span></div>
                    <div class="flex justify-between text-slate-300"><span>CGST</span><span id="ui-cgst">₹0.00</span></div>
                    <div class="flex justify-between text-slate-300"><span>SGST</span><span id="ui-sgst">₹0.00</span></div>
                    <div class="flex justify-between text-slate-300"><span>IGST</span><span id="ui-igst">₹0.00</span></div>
                </div>

                <div class="my-6 border-t border-slate-700"></div>

                <p class="text-xs text-slate-400 uppercase mb-1">Grand Total</p>
                <h2 id="ui-grand" class="text-4xl font-black text-white tracking-tight">₹0.00</h2>
                <div class="mt-3 inline-block bg-slate-800 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full border border-slate-700" id="ui-mode">Inter-State (IGST)</div>

                <button id="downloadPdfBtn" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
                    Generate PDF Invoice
                </button>
            </div>
        </aside>
    </main>

    <!-- Hidden Template for html2pdf -->
    <div id="pdf-container"></div>

    <script type="module" src="./app.js"></script>
</body>
</html>
